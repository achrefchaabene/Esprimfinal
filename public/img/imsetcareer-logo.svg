<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for modern look -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for accent -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background circle for logo mark -->
  <circle cx="35" cy="40" r="25" fill="url(#primaryGradient)" filter="url(#shadow)"/>
  
  <!-- Logo mark - connecting people icon -->
  <g transform="translate(20, 25)">
    <!-- Person 1 -->
    <circle cx="10" cy="8" r="4" fill="white"/>
    <path d="M10 15 L6 25 L14 25 Z" fill="white"/>
    
    <!-- Person 2 -->
    <circle cx="20" cy="8" r="4" fill="white"/>
    <path d="M20 15 L16 25 L24 25 Z" fill="white"/>
    
    <!-- Connection line between people -->
    <line x1="14" y1="20" x2="16" y2="20" stroke="url(#accentGradient)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Digital/tech elements -->
    <circle cx="15" cy="20" r="1.5" fill="url(#accentGradient)"/>
  </g>
  
  <!-- Company name -->
  <text x="75" y="35" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937">
    IMSET
  </text>
  <text x="75" y="55" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="url(#accentGradient)">
    CAREER
  </text>
  
  <!-- Tagline -->
  <text x="75" y="68" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="400" fill="#6b7280" opacity="0.8">
    Recrutement Digital • Tunisie
  </text>
  
  <!-- Decorative elements for tech/digital aspect -->
  <g opacity="0.3">
    <circle cx="200" cy="20" r="2" fill="url(#primaryGradient)"/>
    <circle cx="210" cy="25" r="1.5" fill="url(#accentGradient)"/>
    <circle cx="220" cy="30" r="1" fill="url(#primaryGradient)"/>
  </g>
</svg>