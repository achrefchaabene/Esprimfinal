<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#primaryGradient)"/>
  
  <!-- Simplified connecting people icon -->
  <g transform="translate(8, 10)">
    <!-- Person 1 -->
    <circle cx="5" cy="4" r="2" fill="white"/>
    <path d="M5 7.5 L3 12 L7 12 Z" fill="white"/>
    
    <!-- Person 2 -->
    <circle cx="11" cy="4" r="2" fill="white"/>
    <path d="M11 7.5 L9 12 L13 12 Z" fill="white"/>
    
    <!-- Connection -->
    <line x1="7" y1="10" x2="9" y2="10" stroke="url(#accentGradient)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="8" cy="10" r="0.8" fill="url(#accentGradient)"/>
  </g>
</svg>